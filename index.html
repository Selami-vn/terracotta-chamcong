<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A14C24">
<title>Terracotta · Chấm công thời vụ</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chấm công">
<style>
:root{
  --brown:#A14C24;--brown-d:#7f3a1a;--orange:#F05F22;--green:#00AC82;--green-d:#008a68;
  --ink:#2b1d16;--muted:#8a776c;--line:#eaded6;--bg:#faf6f2;--card:#fff;--red:#c62f2f;--amber:#b7791f;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}.sm{font-size:13px}.b{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--brown);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brown-d)}
.btn.green{background:var(--green)}.btn.green:hover{background:var(--green-d)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:#fff;color:var(--brown);border:1px solid var(--line)}
.btn.ghost:hover{background:#fbf1ea}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1caca}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f05f2222}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* header */
.top{background:#fff;border-bottom:3px solid var(--brown);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px}
.top img{height:38px}
.top .who{line-height:1.2}
.waves{height:6px;background:linear-gradient(90deg,var(--green) 0 70%,var(--orange) 70% 100%)}
.tabs{display:flex;gap:4px;overflow:auto;padding:0 16px;max-width:1180px;margin:0 auto}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brown);border-color:var(--orange)}
.tabbar{background:#fff;border-bottom:1px solid var(--line)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:
  radial-gradient(circle at 85% 10%,#f05f2222 0 140px,transparent 141px),
  radial-gradient(ellipse at 10% 100%,#00ac8222 0 260px,transparent 261px),var(--bg)}
.login .card{width:100%;max-width:380px;padding:28px 24px;box-shadow:0 10px 30px #a14c2418}
.login img{width:100%;max-width:260px;display:block;margin:0 auto 6px}
.login h1{font-size:17px;text-align:center;margin:8px 0 2px;color:var(--brown)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.hint{background:#fff7ef;border:1px dashed #f0b48f;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:12px}

/* staff */
.hero{text-align:center;padding:22px 16px}
.clock{font-size:44px;font-weight:700;letter-spacing:1px;color:var(--brown);font-variant-numeric:tabular-nums}
.status{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;margin:6px 0 14px}
.status.off{background:#f1ebe6;color:var(--muted)}
.status.on{background:#e3f6f0;color:var(--green-d)}
.bigbtn{width:100%;max-width:340px;padding:18px;font-size:18px;border-radius:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:700;color:var(--brown)}
.stat .k{font-size:12px;color:var(--muted)}
@media(max-width:480px){.stat .v{font-size:16px}}

/* tables */
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);background:#fbf7f3}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;cursor:zoom-in;vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#f1ebe6;border:1px solid var(--line)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.open{background:#fff1e6;color:var(--orange)}
.tag.warn{background:#fdecec;color:var(--red)}
.tag.edit{background:#eef3ff;color:#3756b5}
.tag.ok{background:#e3f6f0;color:var(--green-d)}
.tag.off{background:#eee;color:#777}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters>div{min-width:140px}
.filters label{margin-top:0}
.sectionT{font-size:16px;font-weight:700;color:var(--brown);margin:18px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover}

/* modal */
.mback{position:fixed;inset:0;background:#2b1d1699;display:grid;place-items:center;padding:14px;z-index:50}
.mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.mbox.wide{max-width:980px}
.mbox h3{margin:0 0 10px;color:var(--brown)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;margin:0 auto}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam .guide{position:absolute;inset:12% 18% 22%;border:2px dashed #ffffffaa;border-radius:50%;pointer-events:none}
.cam .cclock{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:#0008;color:#fff;font-size:13px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cmp figure{margin:0}
.cmp img,.cmp .none{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#f1ebe6;border:1px solid var(--line)}
.cmp .none{display:grid;place-items:center;color:var(--muted);font-size:13px}
.cmp figcaption{font-size:13px;text-align:center;margin-top:4px}
@media(max-width:640px){.cmp{grid-template-columns:1fr 1fr}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 6px 20px #0003}

/* payroll sheet (screen + print) */
.sheetwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto}
.sheet{font-family:"Times New Roman",Times,serif;color:#000;min-width:980px}
.sheet .hd{display:flex;align-items:flex-start;gap:14px}
.sheet .hd img{height:52px}
.sheet .co{font-size:13px;line-height:1.35}
.sheet .co b{font-size:14px}
.sheet h2{text-align:center;margin:18px 0 0;font-size:19px}
.sheet .sub{text-align:center;font-weight:700;font-size:14px;margin-bottom:12px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th,.sheet td{border:1px solid #000;padding:4px 6px}
.sheet th{font-weight:700;text-align:center}
.sheet td.c{text-align:center}.sheet td.r{text-align:right}
.sheet .tot td{font-weight:700}
.sheet .det{font-size:12px;line-height:1.35;white-space:nowrap}
.sheet .sign{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-top:26px;font-size:14px}
.sheet .sign b{display:block;margin-bottom:70px;font-weight:700}
#printArea{display:none}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;line-height:18px;text-align:center}
/* giao diện điện thoại cho nhân viên */
html{scroll-padding-bottom:110px}
.mtop{display:flex;align-items:center;gap:10px;background:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--brown)}
.mtop img{height:34px}
.mbody{max-width:560px;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;box-shadow:0 -4px 16px #a14c2412}
.bnav button{flex:1;border:0;background:none;padding:8px 4px 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bnav button .ic{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.6}
.bnav button.on{color:var(--brown)}.bnav button.on .ic{filter:none;opacity:1}
.scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sdate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:10px;background:#fbf1ea;color:var(--brown);line-height:1.1}
.sdate span{font-size:11px;color:var(--muted)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.monthbar .b{font-size:17px;color:var(--brown)}
.paycard{text-align:center;background:linear-gradient(135deg,#fff 0,#fff7ef 100%)}
.paycard .big{font-size:32px;font-weight:800;color:var(--brown);margin:2px 0}
.irow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow b{text-align:right}
@media(max-width:640px){.top .who .muted{display:none}.top img{height:30px}.wrap{padding:12px}.mbox{padding:14px}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .sheet{min-width:0}
}
</style>
</head>

const dmy=d=>{d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const dm=d=>{d=new Date(d);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const hm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};
const hms=d=>{d=new Date(d);return hm(d)+':'+pad(d.getSeconds())};

/* ---------- Lớp dữ liệu (IndexedDB) ---------- */
const DB={
  _db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('terracotta_chamcong',2);
    r.onupgradeneeded=()=>{const db=r.result;['users','shifts','kv','requests'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id'})})};
    r.onsuccess=()=>{DB._db=r.result;res()};r.onerror=()=>rej(r.error)})},
  _tx(store,mode,fn){return new Promise((res,rej)=>{const tx=DB._db.transaction(store,mode);const req=fn(tx.objectStore(store));
    tx.oncomplete=()=>res(req?req.result:undefined);tx.onerror=()=>rej(tx.error)})},
  all:s=>DB._tx(s,'readonly',st=>st.getAll()),
  get:(s,id)=>DB._tx(s,'readonly',st=>st.get(id)),
  put:(s,o)=>DB._tx(s,'readwrite',st=>st.put(o)),
  del:(s,id)=>DB._tx(s,'readwrite',st=>st.delete(id)),
  clear:s=>DB._tx(s,'readwrite',st=>st.clear())
};

/* ---------- Mật khẩu: băm PBKDF2-SHA256 + salt, không lưu mật khẩu gốc ---------- */
async function hashPw(pw,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

const normPhone=p=>String(p||'').replace(/\D/g,'');
const excelPhone=p=>{const d=normPhone(p);return d.length===9&&/^[35789]/.test(d)?'0'+d:d}; // Excel hay làm mất số 0 đầu
const validPhone=p=>/^0\d{9}$/.test(p);
const fmtPhone=p=>{p=normPhone(p);return p.length===10?p.slice(0,4)+' '+p.slice(4,7)+' '+p.slice(7):p};
const randPw=()=>String(Math.floor(100000+Math.random()*900000));

/* Số giờ của 1 ca: làm tròn xuống theo cài đặt */
/* Luật chốt giờ ra: vào trước mốc phân ca = Ca 1 (chốt 14:00), sau mốc = Ca 2 (chốt 22:00).
   Ra sau giờ chốt chỉ tính tới giờ chốt; ra sớm hơn tính theo thực tế. Admin có thể duyệt ngoại lệ từng ca. */
function shiftInfo(s){
  const d=new Date(s.inAt),ca=hm(d)<(S.shiftSplit||'12:00')?1:2;
  const [h,m]=String(ca===1?S.cap1:S.cap2).split(':');const cap=new Date(d);cap.setHours(+h,+m,0,0);
  return {ca,cap,capOn:!!S.capOn&&!s.allowOver};
}
function effOut(s){if(!s.outAt)return null;const o=new Date(s.outAt),i=shiftInfo(s);return i.capOn&&o>i.cap?i.cap:o}
const isCapped=s=>!!s.outAt&&effOut(s).getTime()<new Date(s.outAt).getTime();
/* Số phút được tính công: tính theo phút đồng hồ (14:45 → 17:12 = 147 phút), áp giờ chốt ca, làm tròn xuống nếu có cài đặt */
const toMin=d=>Math.floor(new Date(d).getTime()/60000);
function shiftMinutes(s){
  if(!s.outAt)return 0;
  let mins=toMin(effOut(s))-toMin(s.inAt);
  if(!(mins>0))return 0;
  const r=+S.roundMin||1;return Math.floor(mins/r)*r;
}
const shiftHours=s=>shiftMinutes(s)/60;
const fmtHM=m=>{m=Math.round(m||0);return Math.floor(m/60)+'h'+pad(m%60)};
const shiftMoney=s=>Math.round(shiftMinutes(s)*(+s.rate||0)/60);
const inRange=(iso,from,to)=>{const d=ymd(iso);return d>=from&&d<=to};
const byInDesc=(a,b)=>b.inAt.localeCompare(a.inAt);
function avatar(u){if(u&&u.photo)return u.photo;const n=((u&&u.name)||'?').trim().split(/\s+/);const t=(n.length>1?n[n.length-1][0]+n[0][0]:n[0][0]).toUpperCase();
  return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="#f6e7dd"/><text x="40" y="50" font-family="Arial" font-size="30" font-weight="700" fill="#A14C24" text-anchor="middle">${t}</text></svg>`)}

  </form></div>`;
  $('#loginForm').onsubmit=doLogin;
  if(!LOGIN_ADMIN)$('#lu').addEventListener('input',e=>{const v=e.target.value.replace(/\D/g,'').slice(0,10);if(v!==e.target.value)e.target.value=v});

async function doLogin(e){
  e.preventDefault();
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,err=$('#lerr');
  const f=fails[u];
  if(f&&f.until>Date.now()){err.textContent='Sai quá 5 lần. Thử lại sau '+Math.ceil((f.until-Date.now())/1000)+' giây.';return}
  if(!LOGIN_ADMIN&&!/^0\d{9}$/.test(u)){err.textContent='Số điện thoại gồm 10 số, bắt đầu bằng 0 (VD: 0905123456).';return}
  const all=await DB.all('users');
  const user=LOGIN_ADMIN?all.find(x=>x.username===u):all.find(x=>x.phone&&normPhone(x.phone)===u);
  if(!user||!user.active||(await hashPw(p,user.salt))!==user.pw){
    const ff=fails[u]=fails[u]||{n:0};ff.n++;
    if(ff.n>=5){ff.until=Date.now()+60000;ff.n=0}
    err.textContent=user&&!user.active?'Tài khoản đã bị khoá. Liên hệ quản lý.':LOGIN_ADMIN?'Sai tên đăng nhập hoặc mật khẩu.':'Sai số điện thoại hoặc mật khẩu. Chưa có tài khoản thì nhờ quản lý tạo.';return;
  }
  delete fails[u];FIRST_RUN=false;ME=user;sessionStorage.setItem('cc_uid',user.id);route();
}
function changePwModal(forced){
  const m=modal(`<h3>${forced?'Đặt mật khẩu mới':'Đổi mật khẩu'}</h3>
    ${forced?'<p class="muted sm">Vì lý do bảo mật, vui lòng đổi mật khẩu trước khi sử dụng.</p>':''}
    <label>Mật khẩu hiện tại</label><input type="password" id="p0" autocomplete="current-password">
    <label>Mật khẩu mới (ít nhất 6 ký tự)</label><input type="password" id="p1" autocomplete="new-password">
    <label>Nhập lại mật khẩu mới</label><input type="password" id="p2" autocomplete="new-password">
    <div class="err" id="perr"></div>
    <div class="row" style="justify-content:flex-end">${forced?'':'<button class="btn ghost" data-x="close">Huỷ</button>'}<button class="btn" id="psave">Lưu</button></div>`,{lock:forced});
  $('#psave',m).onclick=async()=>{
    const [a,b,c]=['#p0','#p1','#p2'].map(s=>$(s,m).value),err=$('#perr',m);
    const me=await DB.get('users',ME.id);
    if((await hashPw(a,me.salt))!==me.pw)return err.textContent='Mật khẩu hiện tại không đúng.';
    if(b.length<6)return err.textContent='Mật khẩu mới phải có ít nhất 6 ký tự.';
    if(b!==c)return err.textContent='Hai lần nhập không khớp.';
    if(b===a)return err.textContent='Mật khẩu mới phải khác mật khẩu cũ.';
    me.salt=uid();me.pw=await hashPw(b,me.salt);me.mustChange=false;await DB.put('users',me);ME=me;
    m.close();toast('Đã đổi mật khẩu');
  };
}

/* ---------- Modal ---------- */
function modal(html,{wide=false,lock=false}={}){
  const w=document.createElement('div');w.className='mback';
  w.innerHTML=`<div class="mbox ${wide?'wide':''}">${html}</div>`;
  $('#modal-root').appendChild(w);
  w.close=()=>w.remove();
  w.addEventListener('click',e=>{if(e.target.closest('[data-x="close"]')||(!lock&&e.target===w))w.close()});
  return w;
}

/* ---------- Camera: chụp ảnh, đóng dấu giờ + tên lên ảnh ---------- */
function stampImage(src,sw,sh,label,name,at){
  const W=480,H=Math.round(Math.min(sh*W/sw,640));
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  // cắt giữa cho vừa khung
  const scale=Math.max(W/sw,H/sh),dw=sw*scale,dh=sh*scale;
  x.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
  if(label){
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,H-50,W,50);
    x.fillStyle=label.includes('IN')?'#00AC82':(label.includes('OUT')?'#F05F22':'#A14C24');x.fillRect(0,H-50,6,50);
    x.fillStyle='#fff';x.font='bold 17px system-ui,sans-serif';x.fillText(label+' • '+name,14,H-28);
    x.font='15px system-ui,sans-serif';x.fillText(dmy(at)+'  '+hms(at),14,H-9);
  }
  return c.toDataURL('image/jpeg',0.72);
}
function openCamera({title,label='',name='',allowUpload=false}){
  return new Promise(resolve=>{
    const m=modal(`<h3>${esc(title)}</h3>
      <div class="cam" id="cbox"><video id="cv" autoplay playsinline muted></video><img id="cimg" hidden alt=""><div class="guide" id="cguide"></div><div class="cclock" id="cclock"></div></div>
      <p class="muted sm" id="cmsg">Đưa khuôn mặt vào giữa khung, đứng chỗ đủ sáng, không đeo khẩu trang.</p>
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="ccancel">Huỷ</button>
        <button class="btn ghost" id="cpick" ${allowUpload?'':'hidden'}>Chọn ảnh có sẵn</button>
        <button class="btn ghost" id="cretake" hidden>Chụp lại</button>
        <button class="btn orange" id="csnap">📸 Chụp</button>
        <button class="btn green" id="cok" hidden>✓ Xác nhận</button>
      </div>
      <input type="file" id="cfile" accept="image/*" ${allowUpload?'':'capture="user"'} hidden>`,{lock:true});
    const v=$('#cv',m),img=$('#cimg',m),snap=$('#csnap',m),ok=$('#cok',m),re=$('#cretake',m),msg=$('#cmsg',m),file=$('#cfile',m);
    let stream=null,result=null;
    const clk=setInterval(()=>{$('#cclock',m).textContent=(label?label+' • ':'')+dmy(new Date())+' '+hms(new Date())},500);
    const stop=()=>{clearInterval(clk);if(stream)stream.getTracks().forEach(t=>t.stop())};
    const finish=r=>{stop();m.close();resolve(r)};
    const showPreview=(dataUrl,at)=>{result={img:dataUrl,at:at.toISOString()};img.src=dataUrl;img.hidden=false;v.hidden=true;$('#cguide',m).hidden=true;$('#cclock',m).hidden=true;
      snap.hidden=true;ok.hidden=false;re.hidden=false;msg.textContent='Kiểm tra ảnh rõ mặt rồi bấm Xác nhận. Giờ ghi nhận: '+hms(at)+' ngày '+dmy(at)+'.'};
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:960}},audio:false})
        .then(s=>{stream=s;v.srcObject=s})
        .catch(()=>{msg.innerHTML='Không mở được camera trực tiếp (chưa cấp quyền?). Bấm <b>Chụp</b> để mở camera của điện thoại.';v.hidden=true});
    }else{v.hidden=true}
    snap.onclick=()=>{
      if(stream&&v.videoWidth){const at=new Date();showPreview(stampImage(v,v.videoWidth,v.videoHeight,label,name,at),at)}
      else file.click();
    };
    $('#cpick',m).onclick=()=>file.click();
    file.onchange=()=>{const f=file.files[0];if(!f)return;const at=new Date();const im=new Image();
      im.onload=()=>{showPreview(stampImage(im,im.naturalWidth,im.naturalHeight,label,name,at),at);URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
    re.onclick=()=>{result=null;img.hidden=true;$('#cguide',m).hidden=false;$('#cclock',m).hidden=false;ok.hidden=true;re.hidden=true;snap.hidden=false;
      if(stream){v.hidden=false;msg.textContent='Đưa khuôn mặt vào giữa khung rồi chụp lại.'}else file.click()};
    ok.onclick=()=>finish(result);
    $('#ccancel',m).onclick=()=>finish(null);
  });
}

async function staffCheck(kind){
  const open=(await DB.all('shifts')).find(s=>s.userId===ME.id&&!s.outAt);
  if(kind==='in'&&open)return renderStaff();
  if(kind==='out'&&!open)return renderStaff();
  const shot=await openCamera({title:kind==='in'?'Chụp ảnh CHECK IN':'Chụp ảnh CHECK OUT',label:kind==='in'?'CHECK IN':'CHECK OUT',name:ME.name});
  if(!shot)return;
  if(kind==='in'){
    await DB.put('shifts',{id:uid(),userId:ME.id,inAt:shot.at,inPhoto:shot.img,outAt:null,outPhoto:null,rate:+ME.rate||+S.defaultRate,createdAt:new Date().toISOString()});
    toast('Đã check in lúc '+hm(shot.at)+'. Chúc làm việc vui vẻ!');
  }else{
    open.outAt=shot.at;open.outPhoto=shot.img;await DB.put('shifts',open);
    toast('Đã check out lúc '+hm(shot.at)+' · '+fmtHM(shiftMinutes(open)));
  }
  STAB='home';renderStaff();
}

    <div class="grid2"><div><label>Số tài khoản</label><input id="qs" value="${esc(ME.stk||'')}" inputmode="numeric"></div><div><label>Ngân hàng</label><input id="qb" value="${esc(ME.bank||'')}"></div></div>
    <label>Ảnh hồ sơ mới (tuỳ chọn)</label><div class="row"><img id="qph" class="avatar" style="width:60px;height:60px" src="${avatar(ME)}" alt=""><button class="btn ghost sm" id="qsnap">📸 Chụp ảnh mới</button></div>
    <label>Ghi chú cho quản lý</label><input id="qnote" placeholder="VD: Đổi sang tài khoản chính chủ">
    <div class="err" id="qerr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x="close">Huỷ</button><button class="btn" id="qgo">Gửi yêu cầu</button></div>`);
  $('#qsnap',m).onclick=async()=>{const r=await openCamera({title:'Ảnh hồ sơ mới'});if(r){photo=r.img;$('#qph',m).src=photo}};
  $('#qgo',m).onclick=async()=>{
    const v=s=>$(s,m).value.trim(),nv={name:v('#qn'),phone:normPhone(v('#qp')),stk:v('#qs').replace(/\s/g,''),bank:v('#qb')};
    if(!nv.name)return $('#qerr',m).textContent='Họ tên không được để trống.';
    if(!validPhone(nv.phone))return $('#qerr',m).textContent='Số điện thoại phải gồm 10 số, bắt đầu bằng 0.';
    if((await DB.all('users')).some(x=>x.id!==ME.id&&normPhone(x.phone)===nv.phone))return $('#qerr',m).textContent='Số điện thoại này đã có người dùng.';
    if(normPhone(ME.phone)===nv.phone)nv.phone=ME.phone||'';
    const changes={};for(const k in nv)if((ME[k]||'')!==nv[k])changes[k]={from:ME[k]||'',to:nv[k]};

    await DB.put('requests',{id:uid(),userId:ME.id,type:'profile',changes,note:v('#qnote'),status:'pending',createdAt:new Date().toISOString()});
    m.close();toast('Đã gửi yêu cầu, chờ quản lý duyệt');renderStaff();
  };
}
async function reqShift(id){
  const s=await DB.get('shifts',id);if(!s||s.userId!==ME.id)return;
  const m=modal(`<h3>Báo sai giờ · ${dmy(s.inAt)}</h3><p class="muted sm">Giờ app ghi nhận: vào <b>${hm(s.inAt)}</b>, ra <b>${s.outAt?hm(s.outAt):'chưa check out'}</b>. Nhập giờ đúng và lý do, quản lý sẽ kiểm tra.</p>
    <div class="grid2"><div><label>Giờ vào đúng</label><input type="datetime-local" id="ri" value="${toInput(s.inAt)}"></div><div><label>Giờ ra đúng</label><input type="datetime-local" id="ro" value="${s.outAt?toInput(s.outAt):''}"></div></div>
    <label>Lý do (bắt buộc)</label><input id="rn" placeholder="VD: Quên check out, ra lúc 22:00, chị Oanh biết">
    <div class="err" id="rerr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x="close">Huỷ</button><button class="btn" id="rgo">Gửi</button></div>`);
  $('#rgo',m).onclick=async()=>{
    const vi=$('#ri',m).value,vo=$('#ro',m).value,note=$('#rn',m).value.trim(),err=$('#rerr',m);
    if(!vi||!vo)return err.textContent='Nhập đủ giờ vào và giờ ra.';
    if(new Date(vo)<=new Date(vi))return err.textContent='Giờ ra phải sau giờ vào.';
    if(!note)return err.textContent='Vui lòng ghi lý do.';
    await DB.put('requests',{id:uid(),userId:ME.id,type:'shift',shiftId:s.id,shiftDate:s.inAt,current:{inAt:s.inAt,outAt:s.outAt},proposed:{inAt:new Date(vi).toISOString(),outAt:new Date(vo).toISOString()},note,status:'pending',createdAt:new Date().toISOString()});
    m.close();toast('Đã gửi, chờ quản lý duyệt');renderStaff();
  };
}

async function decideReq(id,ok){
  const r=await DB.get('requests',id);if(!r||r.status!=='pending')return;
  let note='';
  if(!ok){note=prompt('Lý do từ chối (nhân viên sẽ thấy):','');if(note===null)return}
  if(ok&&r.type==='profile'){
    const u=await DB.get('users',r.userId);if(!u){alert('Nhân sự không còn tồn tại.');return}
    if(r.changes.phone){const np=normPhone(r.changes.phone.to),dup=(await DB.all('users')).find(x=>x.id!==u.id&&normPhone(x.phone)===np);if(dup){alert('Số điện thoại mới đã dùng cho '+dup.name+'. Hãy từ chối yêu cầu này.');return}}
    for(const [k,c] of Object.entries(r.changes))u[k]=c.to;await DB.put('users',u);
  }
  if(ok&&r.type==='shift'){
    const s=await DB.get('shifts',r.shiftId);if(!s){alert('Ca này đã bị xoá.');return}
    if(!s.orig)s.orig={inAt:s.inAt,outAt:s.outAt};
    s.inAt=r.proposed.inAt;s.outAt=r.proposed.outAt;s.editedBy=ME.name;s.editedAt=new Date().toISOString();s.editNote='Duyệt yêu cầu của nhân viên: '+r.note;
    await DB.put('shifts',s);
  }
  Object.assign(r,{status:ok?'approved':'rejected',decidedBy:ME.name,decidedAt:new Date().toISOString(),decisionNote:note});
  await DB.put('requests',r);toast(ok?'Đã duyệt và cập nhật':'Đã từ chối');renderAdmin();
}

async function loadAll(){const [users,shifts]=await Promise.all([DB.all('users'),DB.all('shifts')]);return {users,shifts,U:Object.fromEntries(users.map(u=>[u.id,u]))}}
const staffOptions=(users,sel)=>`<option value="">Tất cả nhân sự</option>`+users.filter(u=>u.role!=='admin').sort((a,b)=>a.name.localeCompare(b.name,'vi')).map(u=>`<option value="${u.id}" ${sel===u.id?'selected':''}>${esc(u.name)}</option>`).join('');
const quickBtns=t=>`<div class="row">${[['today','Hôm nay'],['yday','Hôm qua'],['7d','7 ngày'],['month','Tháng này'],['lmonth','Tháng trước']].map(([k,l])=>`<button class="btn ghost sm" data-act="quick" data-t="${t}" data-k="${k}">${l}</button>`).join('')}</div>`;
function quickRange(k){
  const t=today(),d=new Date();
  if(k==='today')return [t,t];
  if(k==='yday'){const y=addDays(t,-1);return [y,y]}
  if(k==='7d')return [addDays(t,-6),t];
  if(k==='month')return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),t];
  if(k==='lmonth')return [ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
}

async function editShift(id){

  const m=modal(`<h3>${s?'Sửa giờ ca làm':'Thêm ca thủ công'}</h3>

async function computePayroll(from,to,userId){
  const {shifts,U}=await loadAll();
  const map={};
  shifts.filter(s=>s.outAt&&inRange(s.inAt,from,to)&&(!userId||s.userId===userId)).sort((a,b)=>a.inAt.localeCompare(b.inAt)).forEach(s=>{
    const u=U[s.userId];if(!u)return;
    const r=map[u.id]=map[u.id]||{u,hours:0,money:0,rates:new Set(),det:[]};
    const h=shiftHours(s);r.hours+=h;r.money+=shiftMoney(s);r.rates.add(+s.rate||0);
    r.det.push(`${dm(s.inAt)}: ${hm(s.inAt)}–${hm(effOut(s))}${isCapped(s)?'*':''} (${fmtHM(shiftMinutes(s))})`);if(isCapped(s))r.capped=true;
  });
  const rows=Object.values(map).sort((a,b)=>a.u.name.localeCompare(b.u.name,'vi'));
  return {rows,from,to,range:from===to?ymdToDmy(from):ymdToDmy(from)+'-'+ymdToDmy(to),
    hours:rows.reduce((a,r)=>a+r.hours,0),money:rows.reduce((a,r)=>a+r.money,0)};
}

async function exportXlsx(){
  const d=LASTPAY;if(!d)return;

  const aoa=[[S.company],[S.addr1],[S.addr2],[],[S.title],[d.range],[],head,...body,['','Tổng','','','',Math.round(d.hours*100)/100,'',Math.round(d.money)],[],S.signers,S.signerNames];
  const fname=`Bang-luong-${d.from}_${d.to}`;
  try{

    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:5},{wch:24},{wch:12},{wch:23},{wch:30},{wch:9},{wch:12},{wch:13},{wch:4},{wch:4},{wch:14},{wch:12}];
    ws['!merges']=[{s:{r:4,c:0},e:{r:4,c:11}},{s:{r:5,c:0},e:{r:5,c:11}}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bang luong');XLSX.writeFile(wb,fname+'.xlsx');
  }catch(e){ // không tải được thư viện (mất mạng) → xuất bảng HTML mở được bằng Excel
    const html=`<html><head><meta charset="utf-8"></head><body>${payrollHTML(d).replace(/<img[^>]*>/g,'')}</body></html>`;
    download(fname+'.xls',html,'application/vnd.ms-excel');
  }
}

/* ---------- THÊM NHÂN SỰ HÀNG LOẠT ---------- */
const BULK_COLS=['Họ và tên','Số điện thoại','Bộ phận','Tiền công/giờ','Loại (TV/TT)','STK','Ngân hàng','Mật khẩu (tuỳ chọn)','Tên đăng nhập (tuỳ chọn)'];
const unaccent=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
function makeUsername(name,taken){
  const p=unaccent(name).toLowerCase().replace(/[^a-z\s]/g,'').trim().split(/\s+/).filter(Boolean);
  if(!p.length)return '';
  let base=p.length>1?p[p.length-1]+'.'+p.slice(0,-1).map(w=>w[0]).join(''):p[0];
  if(base.length<3)base=base+'nv';
  let u=base,i=2;while(taken.has(u))u=base+(i++);
  taken.add(u);return u;
}
/* Đọc bảng: nếu có dòng tiêu đề "Họ và tên" thì lấy cột theo tên cột (đọc được cả file bảng lương cũ), không thì theo thứ tự cột */
function parseTable(rows){
  rows=rows.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(c=>c));
  const N=s=>unaccent(s).toLowerCase().replace(/\s+/g,' ').trim();
  const hi=rows.findIndex(r=>r.some(c=>/ho\s*(va\s*)?ten/.test(N(c))));
  let map,body;
  if(hi>=0){
    const h=rows[hi].map(N),find=re=>h.findIndex(c=>re.test(c));
    map={name:find(/ho\s*(va\s*)?ten/),phone:find(/dien thoai|^sdt|so dt|phone/),dept:find(/bo phan|phong ban/),rate:find(/tien cong gio|tien cong\/gio|\/gio|don gia|muc cong/),
      type:find(/^loai|tv\s*\/\s*tt/),stk:find(/^stk$|so tai khoan|so tk/),bank:find(/ngan hang|bank/),un:find(/dang nhap|username/),pw:find(/mat khau|password/),
      tv:find(/^tv$/),tt:find(/^tt$/)};
    body=rows.slice(hi+1);
    if(body[0]&&body[0].some(c=>/^(tv|tt)$/i.test(c))&&!body[0][map.name]){const sub=body[0].map(N);map.tv=sub.indexOf('tv');map.tt=sub.indexOf('tt');body=body.slice(1)}
  }else{
    body=rows;
    if(body.length&&body.every(r=>/^\d{1,4}$/.test(r[0])))body=body.map(r=>r.slice(1)); // bỏ cột Stt
    map={name:0,phone:1,dept:2,rate:3,type:4,stk:5,bank:6,pw:7,un:8,tv:-1,tt:-1};
  }
  const g=(r,i)=>i>=0?(r[i]||''):'';
  return body.filter(r=>!/^t[oổ]ng/i.test(g(r,map.name))).map(r=>{
    let type=g(r,map.type);if(!type){if(g(r,map.tt))type='TT';else if(g(r,map.tv))type='TV'}
    return [g(r,map.name),g(r,map.phone),g(r,map.dept),g(r,map.rate),type,g(r,map.stk),g(r,map.bank),g(r,map.pw),g(r,map.un)];
  }).filter(r=>r.some(c=>c));
}
function parseRows(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return [];
  const sep=lines.some(l=>l.includes('\t'))?'\t':lines[0].includes(';')?';':',';
  return parseTable(lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,''))));
}
async function bulkPreview(m){
  const rows=parseRows($('#btext',m).value),all=await DB.all('users');
  const taken=new Set(all.map(u=>u.username)),phones=new Set(all.map(u=>normPhone(u.phone)).filter(Boolean)),out=[];
  for(const r of rows){
    const [name,phone,dept,rate,type,stk,bank,pw,un]=r;const it={name:(name||'').trim(),err:'',phone:excelPhone(phone)};
    it.dept=dept||S.defaultDept;it.rate=+String(rate||'').replace(/[^\d]/g,'')||+S.defaultRate;
    it.type=/^tt|thực tập|thuc tap/i.test(type||'')?'TT':'TV';it.stk=(stk||'').replace(/\s/g,'');it.bank=bank||S.defaultBank;
    if(!it.name)it.err='Thiếu họ tên';
    if(un){const u=un.trim().toLowerCase();if(!/^[a-z0-9._-]{3,30}$/.test(u))it.err='Tên đăng nhập sai định dạng';else if(taken.has(u))it.err='Trùng tên đăng nhập';else{taken.add(u);it.username=u}}
    else if(it.name){it.username=makeUsername(it.name,taken);if(!it.username)it.err='Họ tên không hợp lệ'}
    if(pw&&pw.length<6)it.err='Mật khẩu dưới 6 ký tự';
    if(it.phone&&!validPhone(it.phone))it.err='SĐT không hợp lệ';else if(it.phone&&phones.has(it.phone))it.err='Trùng SĐT';else if(it.phone)phones.add(it.phone);
    it.pw=pw||randPw();
    if(!it.err&&!it.phone)it.warn='Chưa có SĐT, đăng nhập bằng @'+it.username;else if(!it.err&&all.some(u=>u.name.toLowerCase()===it.name.toLowerCase()))it.warn='Đã có người trùng tên';
    out.push(it);
  }
  m.items=out;
  const ok=out.filter(x=>!x.err).length;
  $('#bprev',m).innerHTML=out.length?`<div class="scroll" style="max-height:300px"><table class="tbl"><thead><tr><th>#</th><th>Họ và tên</th><th>SĐT đăng nhập</th><th>Bộ phận</th><th class="r">Tiền/giờ</th><th>Loại</th><th>STK · Ngân hàng</th><th>Kiểm tra</th></tr></thead><tbody>
    ${out.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${x.phone?fmtPhone(x.phone):'<span class="muted">@'+esc(x.username||'')+'</span>'}</td><td>${esc(x.dept)}</td><td class="r">${money(x.rate)}</td><td>${x.type}</td><td>${esc([x.stk,x.bank].filter(Boolean).join(' · '))}</td>
    <td>${x.err?`<span class="tag warn">${esc(x.err)}</span>`:x.warn?`<span class="tag open">${esc(x.warn)}</span>`:'<span class="tag ok">OK</span>'}</td></tr>`).join('')}</tbody></table></div>`
    :'<p class="muted">Chưa có dòng nào.</p>';
  const b=$('#bgo',m);b.disabled=!ok;b.textContent=`Tạo ${ok} tài khoản`;
}
function bulkModal(){
  const m=modal(`<div class="row"><h3 style="margin:0">Thêm nhân sự hàng loạt</h3><div class="sp"></div><button class="btn ghost sm" data-x="close">Đóng</button></div>
    <p class="muted sm">Cách 1: mở file Excel, bôi đen các dòng nhân sự rồi <b>dán vào ô dưới</b>. Cách 2: <b>tải file</b> Excel/CSV lên. Thứ tự cột:<br>
    <b>${BULK_COLS.join(' | ')}</b><br>Bắt buộc <b>Họ và tên</b>, nên có <b>Số điện thoại</b> vì nhân viên đăng nhập bằng SĐT. Bỏ trống mật khẩu thì app tự tạo 6 số ngẫu nhiên.</p>
    <div class="row" style="margin-bottom:8px"><button class="btn ghost sm" id="btpl">⬇️ Tải file mẫu</button><button class="btn ghost sm" id="bfile">📄 Chọn file Excel / CSV</button><span class="muted sm" id="bfname"></span></div>
    <textarea id="btext" rows="6" placeholder="Võ Mai Thảo&#9;0905123456&#9;Nhà Hàng&#9;35000&#9;TV&#9;0123456789&#9;MBbank&#10;Huỳnh Tiến Kỳ&#9;0912345678&#9;Nhà Hàng&#9;35000&#9;TV&#9;0987654321&#9;MBbank" style="font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>
    <div id="bprev" style="margin-top:10px"></div>
    <div class="err" id="berr"></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><label style="margin:0 auto 0 0;display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" id="bmust" checked style="width:auto"> Bắt đổi mật khẩu lần đầu đăng nhập</label>
      <button class="btn ghost" data-x="close">Huỷ</button><button class="btn" id="bgo" disabled>Tạo 0 tài khoản</button></div>`,{wide:true});
  let tmr;$('#btext',m).addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(()=>bulkPreview(m),250)});
  $('#btpl',m).onclick=()=>bulkTemplate();
  $('#bfile',m).onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv,.txt';
    i.onchange=async()=>{const f=i.files[0];if(!f)return;$('#bfname',m).textContent=f.name;
      try{let text;
        if(/\.(xlsx|xls)$/i.test(f.name)){if(!window.XLSX)await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
          const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
          text=[BULK_COLS,...parseTable(rows)].map(r=>r.join('\t')).join('\n');
        }else text=await f.text();
        $('#btext',m).value=text;bulkPreview(m);
      }catch(e){$('#berr',m).textContent='Không đọc được file (cần có mạng để đọc file .xlsx). Hãy mở file và dán trực tiếp vào ô.'}};
    i.click()};
  $('#bgo',m).onclick=async()=>{
    const items=(m.items||[]).filter(x=>!x.err);if(!items.length)return;
    const b=$('#bgo',m);b.disabled=true;const must=$('#bmust',m).checked;
    const all=await DB.all('users'),taken=new Set(all.map(u=>u.username)),tp=new Set(all.map(u=>normPhone(u.phone)).filter(Boolean));const done=[];
    for(const [k,x] of items.entries()){
      if(taken.has(x.username)||(x.phone&&tp.has(x.phone)))continue;taken.add(x.username);if(x.phone)tp.add(x.phone);
      b.textContent=`Đang tạo ${k+1}/${items.length}...`;
      const salt=uid();
      await DB.put('users',{id:uid(),name:x.name,username:x.username,role:'staff',active:true,salt,pw:await hashPw(x.pw,salt),mustChange:must,
        dept:x.dept,rate:x.rate,type:x.type,stk:x.stk,bank:x.bank,phone:x.phone,photo:null,createdAt:new Date().toISOString()});
      done.push(x);
    }
    m.close();renderAdmin();bulkResult(done);
  };
}
async function bulkTemplate(){
  const rows=[BULK_COLS,['Võ Mai Thảo','0905123456','Nhà Hàng',35000,'TV','','MBbank','',''],['Nguyễn Văn A','0912345678','Buồng phòng',35000,'TT','','Vietcombank','','']];
  try{if(!window.XLSX)await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:24},{wch:14},{wch:14},{wch:14},{wch:12},{wch:16},{wch:14},{wch:18},{wch:22}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Nhan su');XLSX.writeFile(wb,'mau-them-nhan-su.xlsx');
  }catch(e){download('mau-them-nhan-su.csv','﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv')}
}
function slipsHTML(list){
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;font-family:Arial,sans-serif">${list.map(x=>`
    <div style="border:1px dashed #999;padding:5mm;break-inside:avoid;font-size:12px">
      <img src="${LOGO}" style="height:28px"><div style="font-weight:700;margin:6px 0 2px;font-size:14px">${esc(x.name)}</div>
      <div>${esc(x.dept||'')}</div><div style="margin-top:6px">${x.phone?'Số điện thoại':'Tên đăng nhập'}: <b style="font-size:15px">${x.phone?fmtPhone(x.phone):esc(x.username)}</b></div>
      <div>Mật khẩu: <b style="font-size:15px">${esc(x.pw)}</b></div>
      <div style="margin-top:6px;color:#555;font-size:11px">Mở link chấm công quản lý gửi, đăng nhập và đổi mật khẩu ngay lần đầu. Không đưa mật khẩu cho người khác.</div></div>`).join('')}</div>`;
}
function bulkResult(done){
  if(!done.length){toast('Không tạo được tài khoản nào');return}
  const m=modal(`<div class="row"><h3 style="margin:0">Đã tạo ${done.length} tài khoản</h3><div class="sp"></div><button class="btn ghost sm" data-x="close">Đóng</button></div>
    <p class="muted sm">Mật khẩu chỉ hiện <b>một lần này</b>. Tải danh sách hoặc in phiếu đưa cho từng người ngay bây giờ.</p>
    <div class="scroll" style="max-height:340px"><table class="tbl"><thead><tr><th>#</th><th>Họ và tên</th><th>Đăng nhập bằng</th><th>Mật khẩu</th></tr></thead><tbody>
    ${done.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td><b>${x.phone?fmtPhone(x.phone):'@'+esc(x.username)}</b></td><td><b>${esc(x.pw)}</b></td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" id="rslip">🖨️ In phiếu phát cho nhân sự</button><button class="btn green" id="rxl">⬇️ Tải danh sách Excel</button></div>`,{wide:true,lock:true});
  $('#rslip',m).onclick=()=>{$('#printArea').innerHTML=slipsHTML(done);setTimeout(()=>window.print(),200)};
  $('#rxl',m).onclick=async()=>{const rows=[['Họ và tên','Bộ phận','Số điện thoại (đăng nhập)','Tên đăng nhập','Mật khẩu'],...done.map(x=>[x.name,x.dept,x.phone,x.username,x.pw])];
    try{if(!window.XLSX)await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
      const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:24},{wch:14},{wch:18},{wch:12}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tai khoan');XLSX.writeFile(wb,`tai-khoan-nhan-su-${today()}.xlsx`)}
    catch(e){download(`tai-khoan-nhan-su-${today()}.csv`,'﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv')}};
}

/* ---------- Gắn sự kiện ---------- */
const ACTS={
  loginMode(){LOGIN_ADMIN=!LOGIN_ADMIN;renderLogin()},
  logout(){ME=null;STAB='home';SMONTH=null;sessionStorage.removeItem('cc_uid');route()},
  stab(d){STAB=d.tab;renderStaff();window.scrollTo(0,0)},
  smonth(d){const [y,m]=SMONTH.split('-').map(Number);const n=new Date(y,m-1+(+d.d),1);SMONTH=ymd(n).slice(0,7);renderStaff()},
  reqProfile(){reqProfile()},reqShift(d){reqShift(d.id)},reqCancel(d){reqCancel(d.id)},
  reqApprove(d){decideReq(d.id,true)},reqReject(d){decideReq(d.id,false)},install(){installApp()},
  chpw(){changePwModal(false)},
  checkin(){staffCheck('in')},checkout(){staffCheck('out')},
  tab(d){TAB=d.tab;renderAdmin()},
  viewShift(d){viewShift(d.id)},editShift(d){editShift(d.id)},addShift(){editShift(null)},delShift(d){delShift(d.id)},
  attFilter(){F={from:$('#ff').value||today(),to:$('#ft').value||today(),user:$('#fu').value};if(F.from>F.to)[F.from,F.to]=[F.to,F.from];tabAtt()},
  payFilter(){P={from:$('#pf').value||today(),to:$('#pt').value||today(),user:$('#pu').value};if(P.from>P.to)[P.from,P.to]=[P.to,P.from];tabPay()},
  quick(d){const [a,b]=quickRange(d.k);if(d.t==='F'){F.from=a;F.to=b;F.user=$('#fu').value;tabAtt()}else{P.from=a;P.to=b;P.user=$('#pu').value;tabPay()}},
  payPrint(){printPayroll()},payXlsx(){exportXlsx()},
  addUser(){editUser(null)},editUser(d){editUser(d.id)},
  userHist(d){F={from:quickRange('month')[0],to:today(),user:d.id};TAB='att';renderAdmin()},
  saveSet(){saveSettings()},backup(){backup()},restore(){restore()},wipe(){wipe()},demo(){makeDemo()},rmDemo(){removeDemo()},bulkUser(){bulkModal()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACTS[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init().catch(e=>{console.error(e);$('#app').innerHTML='<div class="wrap"><div class="card">Lỗi khởi động: '+esc(e.message||e)+'</div></div>'});
</script>
